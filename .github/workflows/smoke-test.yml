# On-demand smoke test for the live teaser deck.
# Checks that one-pager.trybytes.ai serves the teaser with the capture
# endpoint wired, that the Apps Script endpoint answers, and that a POST
# writes a row (labeled "endpoint_test" — safe to delete from the sheet).
name: smoke-test
on:
  workflow_dispatch:
    inputs:
      post_test_row:
        description: "Also POST a labeled test row to the sheet"
        type: boolean
        default: false

env:
  SITE: https://one-pager.trybytes.ai
  ENDPOINT: https://script.google.com/macros/s/AKfycbxcPyZvgsnc8min1xhaFJr33bwmzMf20ki-_0wa7hk65Ab-9SQCHLojAoulhh9x5Gs/exec
  PH_KEY: phc_uKfd7ENaRfeCvatBzPRDzTyzDgEBA2vQbezy3WVbfgfG
  PH_HOST: https://us.i.posthog.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Live site serves the teaser
        run: |
          html=$(curl -sSL --max-time 30 "$SITE/")
          echo "$html" | grep -q "Bytes AI — Teaser Deck" && echo "PASS: title is Teaser Deck"
          echo "$html" | grep -q 'data-label="Request the deck"' && echo "PASS: CTA slide present"
          echo "$html" | grep -q 'script.google.com/macros/s/AKfycbxcPyZvgsnc8min1xhaFJr33bwmzMf20ki' && echo "PASS: capture endpoint wired into the page"
          if echo "$html" | grep -q 'data-label="Team"'; then echo "FAIL: cut slides leaked into the teaser"; exit 1; else echo "PASS: cut slides absent"; fi
          echo "$html" | grep -q 'id="gate-code"' && echo "PASS: passcode gate present"
          if echo "$html" | grep -q "BYTES2026"; then echo "FAIL: passcode readable in page source"; exit 1; else echo "PASS: passcode not in page source"; fi
          echo "$html" | grep -q 'id="btn-print"' && { echo "FAIL: PDF download button present"; exit 1; } || echo "PASS: no PDF download button"

      - name: Archived full deck still reachable
        run: |
          html=$(curl -sSL --max-time 30 "$SITE/full-deck.html")
          echo "$html" | grep -q "Bytes AI — Investor Deck" && echo "PASS: full deck alive at /full-deck.html"

      - name: PostHog key is valid on the configured region
        run: |
          probe() { curl -s --max-time 30 -X POST "$1/decide?v=3" -H 'Content-Type: application/json' -d "{\"api_key\":\"$PH_KEY\",\"distinct_id\":\"smoke-test\"}"; }
          us=$(probe "$PH_HOST")
          if echo "$us" | grep -q featureFlags; then
            echo "PASS: key accepted on $PH_HOST"
          else
            echo "Configured host rejected the key: $us"
            eu=$(probe "https://eu.i.posthog.com")
            echo "$eu" | grep -q featureFlags && { echo "FAIL: key belongs to EU cloud — switch POSTHOG_HOST to https://eu.i.posthog.com"; exit 1; }
            echo "FAIL: key rejected on US and EU"; exit 1
          fi

      - name: PostHog accepts an event (labeled deck_smoke_test)
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$(curl -s --max-time 30 -X POST "$PH_HOST/i/v0/e/" -H 'Content-Type: application/json' \
            -d "{\"api_key\":\"$PH_KEY\",\"event\":\"deck_smoke_test\",\"distinct_id\":\"smoke-test\",\"timestamp\":\"$now\",\"properties\":{\"source\":\"github-actions\"}}")
          echo "ingest response: $out"
          echo "$out" | grep -q '"status"' && echo "PASS: event ingested — visible in PostHog Activity as deck_smoke_test"

      - name: Capture endpoint answers (GET)
        run: |
          out=$(curl -sSL --max-time 60 "$ENDPOINT")
          echo "GET response: $out"
          echo "$out" | grep -qi "live" && echo "PASS: endpoint deployed and authorized"

      - name: Endpoint writes a row (POST)
        if: ${{ inputs.post_test_row }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$(curl -sSL --max-time 60 -H 'Content-Type: text/plain;charset=utf-8' \
            --data "{\"event\":\"endpoint_test\",\"email\":\"smoke-test@github-actions\",\"name\":\"test row — safe to delete\",\"firm\":\"\",\"deck\":\"Bytes AI Teaser Deck\",\"at\":\"$now\",\"page\":\"github-actions smoke test\",\"referrer\":\"\"}" \
            "$ENDPOINT")
          echo "POST response: $out"
          echo "$out" | grep -q '"ok":true' && echo "PASS: row accepted — check the Leads sheet"
